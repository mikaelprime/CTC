name: CTC CI

on:
    push:
        branches:
            - develop
            - main

    pull_request:
        branches:
            - develop
            - main

jobs:
    backend:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: ctc
                    POSTGRES_PASSWORD: ctc
                    POSTGRES_DB: ctc_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        defaults:
            run:
                working-directory: backend

        env:
            DATABASE_URL: postgresql://ctc:ctc@localhost:5432/ctc_ci
            # tests/conftest.py usa esta (nunca el DATABASE_URL del .env).
            TEST_DATABASE_URL: postgresql://ctc:ctc@localhost:5432/ctc_ci
            SECRET_KEY: ci-only-secret-key
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "60"

        steps:
        -   name: Descargar repositorio
            uses: actions/checkout@v4

        -   name: Instalar Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"

        -   name: Instalar dependencias
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

        -   name: Verificar sintaxis
            run: python -m compileall app

        -   name: Aplicar migraciones
            run: alembic upgrade head

        -   name: Sembrar datos base (roles y usuarios de prueba)
            run: python seed_data.py

        -   name: Ejecutar pruebas
            run: pytest tests -q

    desktop:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: desktop

        steps:
        -   name: Descargar repositorio
            uses: actions/checkout@v4

        -   name: Instalar Python
            uses: actions/setup-python@v5
            with:
                python-version: "3.12"

        -   name: Instalar dependencias
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements-dev.txt

        # Las pruebas de reportes y ticket (PDF/Excel) usan Qt sin pantalla;
        # PySide6 trae Qt, pero necesita estas librerías gráficas del sistema.
        -   name: Librerías del sistema para Qt
            run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

        -   name: Verificar sintaxis
            env:
                QT_QPA_PLATFORM: offscreen
            run: python -m compileall -q .

        -   name: Ejecutar pruebas del escritorio
            env:
                QT_QPA_PLATFORM: offscreen
            run: python -m pytest tests -q
